<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chattie</title>
    <link rel="stylesheet" href="/static/index.css">
    <script>
        var ws = new WebSocket("ws://127.0.0.1:8001");
        function connect(name) {
            ws.send('{"message": "connect", "name": "' + toString(name) + '"}')
        }
        function nameDlg() {
            const dialog = document.querySelector(".nameDlg");
            const submit = document.getElementById("nameDlg-submit");
            const input = document.getElementById("nameDlg-input");
            dialog.classList.remove("hidden");
            submit.addEventListener("click", () => {
                const name = input.value.trim();

                if (name !== "") {
                    dialog.classList.add("hidden");
                    connect(name);
                }
            })
        }

        document.addEventListener("DOMContentLoaded", () => {
            nameDlg()
        })
    </script>
    <link type="stylesheet" href="/static/index.css">
</head>
<body>
    <div class="nameDlg hidden">
        <p>Please type a name</p>
        <br>
        <input id="nameDlg-input">&nbsp;
        <button id="nameDlg-submit">Done</button>
    </div>
</body>
</html>
